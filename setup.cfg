[flake8]
max-line-length = 127
extend-ignore = E203
exclude = .git,__pycache__,docs/source/conf.py,old,build,dist,venv,env,migrations
max-complexity = 15

[isort]
profile = black
multi_line_output = 3
skip = venv,env,migrations

[tool:pytest]
python_files = tests.py test_*.py *_tests.py
addopts = --reuse-db
