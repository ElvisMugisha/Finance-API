services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: finance_api_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_api_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery message broker
  redis:
    image: redis:7-alpine
    container_name: finance_api_redis_prod
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Django API
  api:
    build: .
    container_name: finance_api_prod
    # Uses default CMD from Dockerfile (Gunicorn)
    # Entrypoint script handles migrations if customized, but usually migrations run separately or via a release phase.
    # For simplicity in Compose, we can chain them or assume entrypoint handles waiting.
    # To run migrations automatically on startup in prod (common pattern for simple setups):
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - media_files_prod:/app/media
      - static_files_prod:/app/static
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - USE_DOCKER=True
      - DATABASE=postgres
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # Celery Worker
  celery:
    build: .
    container_name: finance_api_celery_prod
    command: celery -A config worker --loglevel=info
    volumes:
      - media_files_prod:/app/media
    env_file:
      - .env
    environment:
      - USE_DOCKER=True
      - DATABASE=postgres
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: always

volumes:
  postgres_data_prod:
  media_files_prod:
  static_files_prod:
