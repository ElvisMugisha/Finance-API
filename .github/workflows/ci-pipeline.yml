name: CI Pipeline

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  # 1. Linting and Static Analysis
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linting dependencies
        run: |
          pip install flake8 isort black
      - name: Auto-format import sorting with isort
        run: isort . --check-only --diff
      - name: Check code formatting with Black
        run: black . --check --diff
      - name: Lint with flake8
        # Stop the build if there are Python syntax errors or undefined names
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # 2. Test Suite (Fast Unit Tests)
  # This runs strictly on the Codebase using standard Python, to catch logic errors early.
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run Unit Tests
        env:
          SECRET_KEY: test_secret_key
          DEBUG: "True"
          USE_DOCKER: "False"
        run: |
          pytest

  # 3. Docker Build & Integration Tests
  # This builds the container and runs full integration tests inside it.
  docker-validation:
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only run this if we are pushing to a branch, or if unit tests passed.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: finance-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Integration Tests in Docker
        # Spins up the container and runs the full test suite
        run: |
          docker run --rm \
            -e DEBUG=True \
            -e SECRET_KEY=build-secret \
            -e USE_DOCKER=False \
            finance-api:${{ github.sha }} \
            pytest

  # 4. Promote to Staging
  # Automatically creates a PR to staging if all tests pass
  promote-to-staging:
    needs: docker-validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && success()
    permissions:
      contents: write
      pull-requests: write
      issues: write # Added for label management
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Setting up GitHub CLI authentication"
          # Authenticate GitHub CLI with the token
          echo "$GH_TOKEN" | gh auth login --with-token
          gh auth status

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating/updating labels..."
          # Use --force flag to update existing labels or create new ones
          gh label create "automated" --color "0e8a16" --description "Automated PR" --force || echo "Label 'automated' already exists or created"
          gh label create "staging" --color "fbca04" --description "Staging environment" --force || echo "Label 'staging' already exists or created"
          gh label create "promotion" --color "1d76db" --description "Promotion workflow" --force || echo "Label 'promotion' already exists or created"
          echo "Labels ensured"

      - name: Create or Update Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get commit details
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          AUTHOR="${{ github.actor }}"
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Extract repository owner and name
          REPO_OWNER="${GITHUB_REPOSITORY%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          # Create PR body
          PR_BODY=$(cat <<EOF

          ## Automated Promotion from Dev to Staging
          This PR was automatically created after successful CI pipeline run on the \`dev\` branch.

          ### CI Pipeline Status
          - ✅ All tests passed
          - ✅ Linting checks passed
          - ✅ Docker integration tests passed

          ### Commit Details
          - **Triggered by**: ${AUTHOR}
          - **Commit**: ${COMMIT_SHA}
          - **Workflow Run**: ${WORKFLOW_URL}

          ### Review Checklist
          - [ ] Code changes reviewed
          - [ ] No breaking changes
          - [ ] Ready for staging deployment

          **Note**: This PR can be merged automatically or after manual review depending on your team's policy.
          EOF
          )

          echo "Checking for existing PRs from dev to staging..."

          # Try to find existing PR using REST API (more reliable in CI)
          EXISTING_PR=$(gh api "repos/${REPO_OWNER}/${REPO_NAME}/pulls?base=staging&head=${REPO_OWNER}:dev&state=open" \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "Found existing PR #${EXISTING_PR} from dev to staging"

            # Try to update the existing PR
            echo "Attempting to update PR #${EXISTING_PR}..."
            if gh pr edit "$EXISTING_PR" \
              --title "🚀 Auto-promote: dev → staging (Updated)" \
              --body "$PR_BODY" \
              --add-label "automated,staging,promotion" 2>/dev/null; then
              echo "Successfully updated PR #${EXISTING_PR}"
            else
              echo "Could not fully update PR #${EXISTING_PR} (permissions may be limited)"
              echo "Posting comment instead..."
              COMMENT_BODY="**Pipeline Update**: CI passed successfully. New workflow run: ${WORKFLOW_URL}"
              gh pr comment "$EXISTING_PR" --body "$COMMENT_BODY" || \
                echo "Could not comment on PR. The GitHub token may not have sufficient permissions."
            fi
          else
            echo "No existing PR found. Creating new PR..."

            # Create new PR
            gh pr create \
              --base staging \
              --head dev \
              --title "🚀 Auto-promote: dev → staging" \
              --body "$PR_BODY" \
              --label "automated,staging,promotion"

            echo "New PR created successfully"
          fi
