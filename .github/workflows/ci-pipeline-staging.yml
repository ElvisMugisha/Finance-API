name: CI Pipeline for Staging

on:
  push:
    branches: ["staging"]
  pull_request:
    branches: ["staging"]

jobs:
  # 1. Linting and Static Analysis
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linting dependencies
        run: |
          pip install flake8 isort black
      - name: Auto-format import sorting with isort
        run: isort . --check-only --diff
      - name: Check code formatting with Black
        run: black . --check --diff
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  # 2. Test Suite (Fast Unit Tests)
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run Unit Tests
        env:
          SECRET_KEY: test_secret_key
          DEBUG: "True"
          USE_DOCKER: "False"
        run: |
          pytest

  # 3. Docker Build & Integration Tests
  docker-validation:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: finance-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Integration Tests in Docker
        run: |
          docker run --rm \
            -e DEBUG=True \
            -e SECRET_KEY=build-secret \
            -e USE_DOCKER=False \
            finance-api:${{ github.sha }} \
            pytest
